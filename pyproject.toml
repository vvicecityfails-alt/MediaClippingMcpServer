[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-clipping-mcp"
version = "1.0.0"
description = "MCP Server for video/audio clipping using FFmpeg"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "mukul1603", email = "mukul@example.com"}]
keywords = ["mcp", "media", "ffmpeg", "clipping", "video", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2024.1.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
    "anyio>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
media-clip = "media_clipping_mcp.server:main"
media-clip-license = "media_clipping_mcp.license_gen:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true